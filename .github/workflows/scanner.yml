name: Market Scanner Schedule

on:
  schedule:
    # Runs at minutes 17 and 47 past every hour between 14:00 and 20:00 UTC, Mon-Fri
    - cron: '17,47 14-20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scanner
        env:
          SPARK_WEBHOOK_URL: ${{ secrets.SPARK_WEBHOOK_URL }}
          SPARK_WEBHOOK_SECRET: ${{ secrets.SPARK_WEBHOOK_SECRET }}
        run: python scanner.py