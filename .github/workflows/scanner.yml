name: Market Scanner Schedule

on:
  schedule:
    # Runs at minutes 17 and 47 past every hour between 14:00 and 20:00 UTC, Mon-Fri (Regular market hours)
    - cron: '17,47 14-20 * * 1-5'
    # Runs at 20:15 UTC (4:15 PM EST) for the End-of-Day Market Digest
    - cron: '15 20 * * 1-5'
  workflow_dispatch:
    inputs:
      run_digest:
        description: 'Run End-of-Day Digest instead of scanner'
        required: false
        default: false
        type: boolean

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scanner
        env:
          SPARK_WEBHOOK_URL: ${{ secrets.SPARK_WEBHOOK_URL }}
          SPARK_WEBHOOK_SECRET: ${{ secrets.SPARK_WEBHOOK_SECRET }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 20 * * 1-5" ] || [ "${{ inputs.run_digest }}" = "true" ]; then
            python scanner.py --digest
          else
            python scanner.py
          fi
